name: Build and Test

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project DarkroomLite.xcodeproj \
            -scheme DarkroomLite \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release app
        run: |
          xcodebuild build \
            -project DarkroomLite.xcodeproj \
            -scheme DarkroomLite \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Zip app for upload
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.locate.outputs.app_path }}" DarkroomLite.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomLite-macOS
          path: DarkroomLite.zip
          retention-days: 30
